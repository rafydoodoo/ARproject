<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wall 4</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>

    AFRAME.registerComponent('draggable', {
      init() {
        this.dragging = false;
        this.distance = 2;
        this.cursorEl = null;
        this.el.addEventListener('mousedown', this.onDown.bind(this));
        this.el.addEventListener('mouseup',   this.onUp.bind(this));
      },
      onDown(e) {
        this.dragging = true;
        this.cursorEl = e.detail.cursorEl;
        const cam = new THREE.Vector3();
        const obj = new THREE.Vector3();
        this.el.sceneEl.camera.el.object3D.getWorldPosition(cam);
        this.el.parentEl.object3D.getWorldPosition(obj);
        this.distance = cam.distanceTo(obj);
      },
      onUp() { this.dragging = false; this.cursorEl = null; },
      tick() {
        if (!this.dragging || !this.cursorEl) return;
        const rc = this.cursorEl.components.raycaster;
        if (!rc) return;
        const ray = rc.raycaster.ray;
        const pos = new THREE.Vector3().copy(ray.origin).addScaledVector(ray.direction, this.distance);
        this.el.parentEl.object3D.position.copy(pos);
      }
    });

    AFRAME.registerComponent('face-camera', {
      init() { this.zRot = 0; },
      tick() {
        const cam = this.el.sceneEl.camera;
        const camPos = new THREE.Vector3();
        cam.getWorldPosition(camPos);
        const objPos = new THREE.Vector3();
        this.el.object3D.getWorldPosition(objPos);
        camPos.y = objPos.y;
        this.el.object3D.lookAt(camPos);
        this.el.object3D.rotation.z = this.zRot;
      }
    });

    AFRAME.registerComponent('spin-btn', {
      schema: { direction: { default: 1 } },
      init() {
        this.el.addEventListener('click', () => {
          const group = document.querySelector('#video-group');
          const fc = group.components['face-camera'];
          fc.zRot += THREE.MathUtils.degToRad(15 * this.data.direction);
        });
      }
    });

    AFRAME.registerComponent('resize-btn', {
      schema: { factor: { default: 1.2 } },
      init() {
        this.el.addEventListener('click', () => {
          document.querySelector('#video-group').object3D.scale.multiplyScalar(this.data.factor);
        });
      }
    });

    AFRAME.registerComponent('menu-autohide', {
      init() {
        this.lastGazeTime      = Date.now();
        this.hidden            = false;
        this.TIMEOUT           = 5000;
        this.listenersAttached = false;
        this.menuEl            = null;
        this.onGazeEnter = () => {
          this.lastGazeTime = Date.now();
          if (this.hidden && this.menuEl) {
            this.menuEl.setAttribute('visible', true);
            this.hidden = false;
          }
        };
      },
      tick() {
        if (!this.menuEl) this.menuEl = document.querySelector('#menu-group');
        if (!this.menuEl) return;
        if (!this.listenersAttached) {
          document.querySelectorAll('.clickable').forEach(el => el.addEventListener('mouseenter', this.onGazeEnter));
          this.listenersAttached = true;
        }
        if (!this.hidden && Date.now() - this.lastGazeTime > this.TIMEOUT) {
          this.menuEl.setAttribute('visible', false);
          this.hidden = true;
        }
      }
    });

  </script>
</head>
<body>
  <a-scene
    webxr="requiredFeatures: local-floor; optionalFeatures: bounded-floor,hand-tracking,hit-test"
    xr-mode-ui="XRMode: ar"
    background="color: transparent"
    renderer="alpha: true; colorManagement: true; antialias: true"
    menu-autohide>

    <a-assets>
      <video id="vid" src="video4.mp4" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-entity id="video-group" position="0 1.6 -2.5" face-camera>

      <a-plane id="screen"
               width="1.5" height="1.5"
               material="src: #vid; shader: flat"
               class="clickable"
               draggable>
      </a-plane>

      <a-entity id="menu-group">

        <a-box width="0.18" height="0.14" depth="0.04" position="-0.67 0.88 0.02"
               color="#8e44ad" class="clickable" spin-btn="direction: -1">
          <a-text value="&#8634;" align="center" position="0 0.005 0.025" color="#fff" width="1.0" font="dejavu"></a-text>
        </a-box>

        <a-box width="0.18" height="0.14" depth="0.04" position="0.67 0.88 0.02"
               color="#8e44ad" class="clickable" spin-btn="direction: 1">
          <a-text value="&#8635;" align="center" position="0 0.005 0.025" color="#fff" width="1.0" font="dejavu"></a-text>
        </a-box>

        <a-plane width="1.58" height="0.18" position="0 -0.88 0.01" color="#1a1a1a"></a-plane>

        <a-box width="0.18" height="0.14" depth="0.04" position="-0.62 -0.88 0.02"
               color="#c0392b" class="clickable" resize-btn="factor: 0.83">
          <a-text value="&#8722; Smaller" align="center" position="0 0.005 0.025" color="#fff" width="1.4" font="dejavu"></a-text>
        </a-box>

        <a-box id="btn-play" width="0.28" height="0.14" depth="0.04" position="0 -0.88 0.02"
               color="#2980b9" class="clickable">
          <a-text id="txt-play" value="&#9654; Play" align="center" position="0 0 0.025" color="#fff" width="1.6" font="dejavu"></a-text>
        </a-box>

        <a-box width="0.18" height="0.14" depth="0.04" position="0.62 -0.88 0.02"
               color="#27ae60" class="clickable" resize-btn="factor: 1.2">
          <a-text value="+ Bigger" align="center" position="0 0.005 0.025" color="#fff" width="1.4" font="dejavu"></a-text>
        </a-box>

        <a-text value="Pinch and hold screen to move"
                align="center" position="0 -0.72 0.02" color="#666" width="3.0" font="dejavu"></a-text>

      </a-entity>
    </a-entity>

    <a-entity hand-tracking-controls="hand: right; modelStyle: dots"
      raycaster="objects: .clickable; far: 50; showLine: true; lineColor: white; lineOpacity: 0.8"
      cursor="fuse: false; downEvents: pinchstarted; upEvents: pinchended">
    </a-entity>

    <a-entity hand-tracking-controls="hand: left; modelStyle: dots"
      raycaster="objects: .clickable; far: 50; showLine: true; lineColor: white; lineOpacity: 0.8"
      cursor="fuse: false; downEvents: pinchstarted; upEvents: pinchended">
    </a-entity>

    <a-camera position="0 1.6 0">
      <a-cursor fuse="true" fuse-timeout="1200" color="#fff" opacity="0.8"
                raycaster="objects: .clickable; far: 50"></a-cursor>
    </a-camera>

  </a-scene>

  <script>
    const video   = document.getElementById('vid');
    const btnPlay = document.getElementById('btn-play');
    const txtPlay = document.getElementById('txt-play');
    document.querySelector('a-scene').addEventListener('loaded', () => {
      video.play().catch(() => console.warn('Autoplay blocked — tap Play.'));
    });
    btnPlay.addEventListener('click', () => {
      if (video.paused) { video.play(); txtPlay.setAttribute('value', '\u23F8 Pause'); }
      else { video.pause(); txtPlay.setAttribute('value', '\u25B6 Play'); }
    });
  </script>
</body>
</html>
