<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Video Player</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script>
    /* ================================================================
       COMPONENT: draggable
       Drag ONLY when pointing at the video screen (not buttons).
       ================================================================ */
    AFRAME.registerComponent('draggable', {
      init() {
        this.dragging = false;
        this.distance = 2;
        this.cursorEl = null;

        // Start drag only if the actual target is the screen plane.
        this.el.addEventListener('mousedown', (e) => {
          // In A-Frame, e.target is the entity that received the event.
          // When clicking nested UI, we do NOT want to drag.
          if (this.el.id !== 'screen') return;
          this.onDown(e);
        });

        this.el.addEventListener('mouseup', this.onUp.bind(this));
        this.el.addEventListener('mouseleave', this.onUp.bind(this));
      },
      onDown(e) {
        this.dragging = true;
        this.cursorEl = e.detail && e.detail.cursorEl ? e.detail.cursorEl : null;

        // Measure distance from camera to the parent group so it
        // stays at the same depth while you drag
        const cam = new THREE.Vector3();
        const obj = new THREE.Vector3();
        this.el.sceneEl.camera.el.object3D.getWorldPosition(cam);
        this.el.parentEl.object3D.getWorldPosition(obj);
        this.distance = cam.distanceTo(obj);
      },
      onUp() {
        this.dragging = false;
        this.cursorEl = null;
      },
      tick() {
        if (!this.dragging || !this.cursorEl) return;
        const rc = this.cursorEl.components.raycaster;
        if (!rc) return;

        const ray = rc.raycaster.ray;
        const pos = new THREE.Vector3()
          .copy(ray.origin)
          .addScaledVector(ray.direction, this.distance);

        // Move the whole group, not just the screen plane
        this.el.parentEl.object3D.position.copy(pos);
      }
    });

    /* ================================================================
       COMPONENT: resize-btn
       Scales the #video-group entity up or down by a multiplier.
       ================================================================ */
    AFRAME.registerComponent('resize-btn', {
      schema: { factor: { default: 1.2 } },
      init() {
        // Prevent clicks on this button from being interpreted as a drag start.
        this.el.addEventListener('mousedown', (e) => e.stopPropagation());
        this.el.addEventListener('click', (e) => {
          e.stopPropagation();
          document.querySelector('#video-group').object3D.scale
            .multiplyScalar(this.data.factor);
        });
      }
    });

    /* ================================================================
       COMPONENT: click-stop
       Stops pointer events from bubbling up to the screen drag surface.
       Use on UI elements like play/pause button.
       ================================================================ */
    AFRAME.registerComponent('click-stop', {
      init() {
        this.el.addEventListener('mousedown', (e) => e.stopPropagation());
        this.el.addEventListener('click', (e) => e.stopPropagation());
      }
    });
  </script>
</head>
<body>

  <a-scene
    webxr="requiredFeatures: local-floor; optionalFeatures: bounded-floor,hand-tracking,hit-test"
    background="color: transparent"
    renderer="alpha: true; colorManagement: true; antialias: true">

    <!-- ============================================================
         ASSETS — ensure video.mp4 is in the SAME folder as this file
         ============================================================ -->
    <a-assets>
      <video id="vid"
             src="video.mp4"
             loop playsinline webkit-playsinline
             crossorigin="anonymous">
      </video>
    </a-assets>

    <!-- ============================================================
         VIDEO GROUP
         Everything inside here moves/scales together.
         Starting position: 2.5 m in front, at eye height (1.6 m).
         ============================================================ -->
    <a-entity id="video-group" position="0 1.6 -2.5">

      <!-- Dark outer frame (slightly larger than the screen) -->
      <a-plane width="1.58" height="1.58"
               color="#111111"
               position="0 0 -0.03">
      </a-plane>

      <!-- ── VIDEO SCREEN ──────────────────────────────────────────
           NOTE: screen is NOT .clickable now; it is a separate class
           so UI buttons win ray priority cleanly.
           Hold trigger on the screen to drag the whole player.
           ──────────────────────────────────────────────────────── -->
      <a-plane id="screen"
               width="1.5" height="1.5"
               material="src: #vid; shader: flat"
               class="draggable-surface"
               position="0 0 -0.02"
               draggable>
      </a-plane>

      <!-- Control bar background -->
      <a-plane width="1.58" height="0.18"
               position="0 -0.88 0.03"
               color="#1a1a1a">
      </a-plane>

      <!-- ▶ / ⏸  Play / Pause button -->
      <a-box id="btn-play"
             width="0.28" height="0.13" depth="0.04"
             position="-0.55 -0.88 0.04"
             color="#2980b9"
             class="clickable"
             click-stop>
        <a-text id="txt-play"
                value="&#9654; Play"
                align="center" position="0 0 0.025"
                color="#ffffff" width="1.6" font="dejavu">
        </a-text>
      </a-box>

      <!-- Hint label -->
      <a-text value="Hold trigger on screen to move"
              align="center" position="0 -0.88 0.04"
              color="#888888" width="3.0" font="dejavu">
      </a-text>

      <!-- + Make bigger -->
      <a-box width="0.13" height="0.13" depth="0.04"
             position="0.67 -0.88 0.04"
             color="#27ae60"
             class="clickable"
             resize-btn="factor: 1.2">
        <a-text value="+"
                align="center" position="0 0.005 0.025"
                color="#ffffff" width="0.9" font="dejavu">
        </a-text>
      </a-box>

      <!-- − Make smaller -->
      <a-box width="0.13" height="0.13" depth="0.04"
             position="0.50 -0.88 0.04"
             color="#c0392b"
             class="clickable"
             resize-btn="factor: 0.83">
        <a-text value="&#8722;"
                align="center" position="0 0.005 0.025"
                color="#ffffff" width="0.9" font="dejavu">
        </a-text>
      </a-box>

    </a-entity>
    <!-- end #video-group -->

    <!-- ============================================================
         META QUEST CONTROLLERS
         Both controllers emit a ray. Trigger = click/drag.
         IMPORTANT: raycaster includes BOTH .clickable (buttons)
                    and .draggable-surface (screen drag).
         ============================================================ -->
    <a-entity
      oculus-touch-controls="hand: right"
      raycaster="objects: .clickable, .draggable-surface; far: 10; lineColor: white; lineOpacity: 0.5"
      cursor="fuse: false">
    </a-entity>

    <a-entity
      oculus-touch-controls="hand: left"
      raycaster="objects: .clickable, .draggable-surface; far: 10; lineColor: white; lineOpacity: 0.5"
      cursor="fuse: false">
    </a-entity>

    <!-- ============================================================
         CAMERA + GAZE CURSOR (Desktop fallback)
         On desktop: hover over a button for 1.5 s to click it.
         ============================================================ -->
    <a-camera position="0 1.6 0">
      <a-cursor fuse="true" fuse-timeout="1500"
                color="#ffffff" opacity="0.8"
                raycaster="objects: .clickable, .draggable-surface">
      </a-cursor>
    </a-camera>

  </a-scene>

  <script>
    const video   = document.getElementById('vid');
    const btnPlay = document.getElementById('btn-play');
    const txtPlay = document.getElementById('txt-play');

    // Try to autoplay when the scene finishes loading
    document.querySelector('a-scene').addEventListener('loaded', () => {
      video.play().catch(() => {
        console.warn('Autoplay blocked. Tap the Play button to start the video.');
      });
    });

    // Toggle play / pause on button click
    btnPlay.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        txtPlay.setAttribute('value', '\u23F8 Pause');
      } else {
        video.pause();
        txtPlay.setAttribute('value', '\u25B6 Play');
      }
    });
  </script>

</body>
</html>
